services:
  web:
    # Add package mounts here when a WordPress package exists.
    # DDEV_APPROOT points to this dev/wordpress-* environment folder on the host.
    #
    volumes:
      - type: bind
        source: ${DDEV_APPROOT}/../../packages/wpcamp-hub-theme
        target: /var/www/html/wp-content/themes/wpcamp-hub-theme

name: wpcamp-hub-plugin CI

on:
  push:
    branches:
      - dev
    paths:
      - packages/wpcamp-hub-plugin/**
      - .github/workflows/wpcamp-hub-plugin-ci.yml
      - .github/workflows/wpcamp-hub-plugin-setup.yml
  pull_request:
    paths:
      - packages/wpcamp-hub-plugin/**
      - .github/workflows/wpcamp-hub-plugin-ci.yml
      - .github/workflows/wpcamp-hub-plugin-setup.yml

concurrency:
  group: wpcamp-hub-plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wpcamp-hub-plugin-setup:
    uses: ./.github/workflows/wpcamp-hub-plugin-setup.yml
    with:
      mode: dev

  wpcamp-hub-plugin-test-js:
    runs-on: ubuntu-latest
    needs: wpcamp-hub-plugin-setup

    defaults:
      run:
        working-directory: packages/wpcamp-hub-plugin

    steps:
      - uses: actions/checkout@v6

      - name: Restore Node dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/wpcamp-hub-plugin/node_modules
            packages/wpcamp-hub-plugin/build
          key: ${{ needs.wpcamp-hub-plugin-setup.outputs.node-cache-key }}
          fail-on-cache-miss: true

      - name: Lint JS
        run: npm run lint:js

      - name: Lint style
        run: npm run lint:style

      - name: Build assets
        run: npm run build

  wpcamp-hub-plugin-test-php:
    runs-on: ubuntu-latest
    needs: wpcamp-hub-plugin-setup

    defaults:
      run:
        working-directory: packages/wpcamp-hub-plugin

    steps:
      - uses: actions/checkout@v6

      - name: Restore PHP dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/wpcamp-hub-plugin/vendor
            packages/wpcamp-hub-plugin/vendor-prefixed
          key: ${{ needs.wpcamp-hub-plugin-setup.outputs.php-cache-key }}
          fail-on-cache-miss: true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: cs2pr

      - name: PHPStan
        run: composer run phpstan:ci

      - name: PHPCS
        id: phpcs
        continue-on-error: true
        run: composer run phpcs:ci

      - name: Show PHPCS results in PR
        if: ${{ always() && steps.phpcs.outcome == 'failure' }}
        run: cs2pr ./phpcs-report.xml --graceful-warnings

  wpcamp-hub-plugin-test-application:
    runs-on: ubuntu-latest
    needs:
      - wpcamp-hub-plugin-setup
      - wpcamp-hub-plugin-test-php
      - wpcamp-hub-plugin-test-js
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

    defaults:
      run:
        working-directory: packages/wpcamp-hub-plugin

    steps:
      - uses: actions/checkout@v6

      - name: Restore PHP dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/wpcamp-hub-plugin/vendor
            packages/wpcamp-hub-plugin/vendor-prefixed
          key: ${{ needs.wpcamp-hub-plugin-setup.outputs.php-cache-key }}
          fail-on-cache-miss: true

      - name: Restore Node dependencies cache
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/wpcamp-hub-plugin/node_modules
            packages/wpcamp-hub-plugin/build
          key: ${{ needs.wpcamp-hub-plugin-setup.outputs.node-cache-key }}
          fail-on-cache-miss: true

      - name: Write Composer auth for test dependencies
        if: env.COMPOSER_AUTH != ''
        run: printf '%s' "$COMPOSER_AUTH" > tests/auth.json

      - name: Start wp-env
        run: npm run env:start

      - name: Run application tests
        run: npm run test:php
